name: eurydice-backend-prod
services:

  db:
    container_name: eurydice-database
    restart: unless-stopped
    image: postgres:17.6
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

  rabbitmq:
    container_name: eurydice-rabbitmq
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - ${RABBITMQ_PORT}:${RABBITMQ_PORT}
      - 1${RABBITMQ_PORT}:1${RABBITMQ_PORT}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  app:
    container_name: eurydice-api
    restart: unless-stopped
    image: ghcr.io/eurydice-eip/eurydice-backend:latest
    ports:
      - ${API_PORT}:${API_PORT}
    env_file:
      - .env
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
    volumes:
      - uploads:${UPLOADS_DIR}
    depends_on:
      - db
      - rabbitmq

  nginx:
    container_name: eurydice-nginx
    restart: unless-stopped
    image: nginx:1.31.0
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - uploads:${UPLOADS_DIR}:ro
      - ./nginx.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
    entrypoint: /nginx-entrypoint.sh
    depends_on:
      - app

  db_monitoring:
    container_name: eurydice-db-monitoring
    restart: unless-stopped
    image: adminer:5.4.1
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - db

volumes:
  db_data:
    name: eurydice-db-data
  uploads:
    name: eurydice-uploads
